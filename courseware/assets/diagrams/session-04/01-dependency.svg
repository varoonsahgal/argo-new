<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="100%" height="100%" fill="#101018"/><text x="50" y="66" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#f8f7fc">Two resources. One dependency.</text><text x="50" y="108" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">The task cannot start until its required setting exists.</text><rect x="50" y="150" width="440" height="230" rx="20" fill="#20202e" stroke="#e950bc" stroke-width="3"/><text x="80" y="205" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#e950bc">CONFIGMAP</text><text x="80" y="253" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#f8f7fc">cache-settings</text><text x="80" y="302" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">CACHE_TARGET: web</text><text x="80" y="349" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">Supplies the setting</text><rect x="710" y="150" width="440" height="230" rx="20" fill="#20202e" stroke="#66d7c7" stroke-width="3"/><text x="740" y="205" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#66d7c7">JOB</text><text x="740" y="253" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#f8f7fc">warm-cache</text><text x="740" y="302" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">Reads CACHE_TARGET</text><text x="740" y="349" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">Runs a short task</text><polyline points="505,263 690,263" fill="none" stroke="#e950bc" stroke-width="4"/><polyline points="668,249 690,263 668,277" fill="none" stroke="#e950bc" stroke-width="4"/><text x="526" y="242" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#c7c4d3">needed by</text><text x="50" y="446" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#f8f7fc">A valid Job can exist while its container is unable to start.</text></svg>