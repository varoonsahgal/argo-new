<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710"><rect width="100%" height="100%" fill="#101018"/><text x="50" y="66" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#f8f7fc">One number changes the outcome.</text><rect x="50" y="115" width="530" height="485" rx="20" fill="#20202e" stroke="#e950bc" stroke-width="3"/><rect x="620" y="115" width="530" height="485" rx="20" fill="#20202e" stroke="#66d7c7" stroke-width="3"/><text x="80" y="166" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#f37aca">BEFORE: BLOCKED</text><text x="650" y="166" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#66d7c7">AFTER: CAN PROCEED</text><text x="80" y="227" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#f8f7fc">Wave 1: Job</text><text x="80" y="260" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">Needs cache-settings</text><text x="80" y="297" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">Container cannot start</text><text x="80" y="437" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#f8f7fc">Wave 2: ConfigMap</text><text x="80" y="470" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">Not applied: wave 1 unfinished</text><text x="650" y="227" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#f8f7fc">Wave 0: ConfigMap</text><text x="650" y="260" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">Setting is created</text><text x="650" y="437" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#f8f7fc">Wave 1: Job</text><text x="650" y="470" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#c7c4d3">Reads the setting and completes</text><polyline points="315,326 315,368" fill="none" stroke="#e950bc" stroke-width="4"/><polyline points="300,373 330,397" fill="none" stroke="#e950bc" stroke-width="4"/><polyline points="330,373 300,397" fill="none" stroke="#e950bc" stroke-width="4"/><polyline points="885,302 885,388" fill="none" stroke="#66d7c7" stroke-width="4"/><polyline points="871,370 885,391 899,370" fill="none" stroke="#66d7c7" stroke-width="4"/><text x="80" y="555" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#f37aca">Each waits for the other.</text><text x="650" y="555" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#66d7c7">Prerequisite first. Task second.</text><text x="50" y="656" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#f8f7fc">Fix in Git: move the ConfigMap from wave 2 to wave 0.</text></svg>