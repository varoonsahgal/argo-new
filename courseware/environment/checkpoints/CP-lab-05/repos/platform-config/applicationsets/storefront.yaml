# COMPLETE storefront ApplicationSet (Lab 4 answers, present from cp-lab-05).
# Matrix of cluster (workload only) x git-files (per env). Generates
# storefront-{dev,staging,prod}-workload. prod stays pinned via its config.yaml
# targetRevision. applicationsSync=create-update and preserveResourcesOnDeletion
# reflect the end of Lab 4.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storefront
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  cluster-role: workload
          - git:
              repoURL: http://lab-gitea:3000/course/storefront-gitops.git
              revision: main
              files:
                - path: "envs/*/config.yaml"
  template:
    metadata:
      name: "storefront-{{ .env }}-{{ .name }}"
    spec:
      project: storefront
      source:
        repoURL: http://lab-gitea:3000/course/storefront-gitops.git
        targetRevision: "{{ .targetRevision }}"
        path: charts/storefront
        helm:
          valueFiles:
            - "../../envs/{{ .env }}/values.yaml"
      destination:
        server: "{{ .server }}"
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
