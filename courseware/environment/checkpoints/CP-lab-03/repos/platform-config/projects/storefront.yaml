# COMPLETE storefront AppProject (Lab 2 E4 answers, present from cp-lab-03).
# Exactly what Lab 2 asks for: ONE destination (storefront-dev). Lab 3 Exercise 2
# widens it to storefront-staging on purpose, and teaches the rejection you get
# first. cp-lab-04 (Day 2) replaces this file with all three destinations.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: storefront
  namespace: argocd
spec:
  description: Storefront application-team project
  sourceRepos:
    - http://lab-gitea:3000/course/storefront-gitops.git
  destinations:
    - server: https://k3d-workload-server-0:6443
      namespace: storefront-dev
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: autoscaling
      kind: HorizontalPodAutoscaler
