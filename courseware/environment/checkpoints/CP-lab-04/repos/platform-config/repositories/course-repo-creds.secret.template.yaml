# TEMPLATE — credential template covering ALL course repos under the org
# (present from cp-lab-04). PLACEHOLDER only; rendered with the Gitea password.
# A repo-creds Secret supplies credentials by URL PREFIX, so a single entry
# authenticates every http://lab-gitea:3000/course/* repository the AppSet and
# App-of-Apps reference.
apiVersion: v1
kind: Secret
metadata:
  name: course-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
stringData:
  type: git
  url: http://lab-gitea:3000/course/
  username: student
  password: <PASSWORD>
