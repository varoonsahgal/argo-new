# TEMPLATE — the workload-cluster registration Secret (Lab 2 E2).
#
# This file contains PLACEHOLDERS only, never real credentials. In Lab 2 the
# participant renders it into a real Secret by substituting:
#   <TOKEN>   the bearer token from the argocd-manager ServiceAccount on the
#             workload cluster (base64-DECODED value of the token Secret)
#   <CA_DATA> the workload cluster API server CA certificate, base64-encoded
#             (this is already-base64 data placed into caData)
#
# Argo CD reaches the workload cluster by container name over the shared Docker
# network, which is why the server URL uses k3d-workload-server-0.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-workload
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cluster-role: workload
    region: lab
type: Opaque
stringData:
  name: workload
  server: https://k3d-workload-server-0:6443
  # namespaces + clusterResources:false scope Argo CD to only these namespaces
  # and forbid cluster-scoped writes (least privilege).
  namespaces: storefront-dev,storefront-staging,storefront-prod,team-a,platform-system
  clusterResources: "false"
  config: |
    {
      "bearerToken": "<TOKEN>",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "<CA_DATA>"
      }
    }
