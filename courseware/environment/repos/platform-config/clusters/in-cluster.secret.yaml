# The in-cluster (management cluster) registration Secret.
#
# The management cluster where Argo CD runs is normally an implicit "in-cluster"
# entry with no Secret. We create an explicit Secret with LABELS ONLY (no
# credentials — Argo CD uses its own ServiceAccount in-cluster) so that label
# selectors, such as an ApplicationSet cluster generator's `cluster-role`
# selector, can address or exclude the management cluster deliberately.
#
# Applied by bootstrap. Contains no secret material, so it is safe in Git.
apiVersion: v1
kind: Secret
metadata:
  name: in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cluster-role: management
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: |
    {
      "tlsClientConfig": {
        "insecure": false
      }
    }
