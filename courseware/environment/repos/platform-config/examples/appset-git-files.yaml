# Example ApplicationSet — git files generator. Dry-run demonstration only.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: example-git-files
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: http://lab-gitea:3000/course/storefront-gitops.git
        revision: main
        files:
          - path: "envs/*/config.yaml"
  template:
    metadata:
      name: "example-{{ .env }}"
    spec:
      project: storefront
      source:
        repoURL: http://lab-gitea:3000/course/storefront-gitops.git
        targetRevision: "{{ .targetRevision }}"
        path: charts/storefront
        helm:
          valueFiles:
            - "../../envs/{{ .env }}/values.yaml"
      destination:
        server: https://k3d-workload-server-0:6443
        namespace: "{{ .namespace }}"
