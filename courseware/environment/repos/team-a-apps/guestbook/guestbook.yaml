---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
  namespace: team-a
  labels:
    app.kubernetes.io/name: guestbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook
    spec:
      containers:
        - name: podinfo
          image: stefanprodan/podinfo:6.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: guestbook
  namespace: team-a
  labels:
    app.kubernetes.io/name: guestbook
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: guestbook
  ports:
    - name: http
      port: 9898
      targetPort: http
