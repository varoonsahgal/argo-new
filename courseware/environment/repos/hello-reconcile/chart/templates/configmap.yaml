apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-reconcile
  labels:
    app.kubernetes.io/name: hello-reconcile
data:
  # podinfo reads these environment variables (viper prefix PODINFO_).
  # Changing values.yaml -> message/color re-renders this ConfigMap, which is the
  # single change Lab 1 tracks through the reconciliation loop.
  PODINFO_UI_MESSAGE: {{ .Values.message | quote }}
  PODINFO_UI_COLOR: {{ .Values.color | quote }}
