apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "storefront.name" . }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
  annotations:
    # Sync-wave -1: the ConfigMap is applied before the Deployment (wave 0) so the
    # pods always start with the config they expect.
    argocd.argoproj.io/sync-wave: "-1"
data:
  PODINFO_UI_MESSAGE: {{ .Values.ui.message | quote }}
  PODINFO_UI_COLOR: {{ .Values.ui.color | quote }}
