apiVersion: v1
kind: Service
metadata:
  name: {{ include "storefront.name" . }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector:
    {{- include "storefront.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 9898
      targetPort: http
