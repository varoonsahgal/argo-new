apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storefront.name" . }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # image.tag is required: an env that forgets to set it fails rendering here
  # with a readable message rather than deploying an unintended image.
  {{- $tag := required "image.tag is required (set it in envs/<env>/values.yaml)" .Values.image.tag }}
  replicas: {{ .Values.replicaCount }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "storefront.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "storefront.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: podinfo
          image: "{{ .Values.image.repository }}:{{ $tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
          envFrom:
            - configMapRef:
                name: {{ include "storefront.name" . }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
