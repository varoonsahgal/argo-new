# Session 4 · Module 1.5 practice resource: a teammate's change.
apiVersion: batch/v1
kind: Job
metadata:
  name: warm-cache
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: warm-cache
          image: busybox:1.37.0
          command: ["sh", "-c", "echo \"warming cache for $CACHE_TARGET\"; sleep 3; echo 'cache warm'"]
          envFrom:
            - configMapRef:
                name: cache-settings
