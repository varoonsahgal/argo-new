# BROKEN RECORD (Lab 2 E5, optional) — a cluster registration Secret whose server
# URL is a loopback address. `127.0.0.1` means "me" wherever it is read, so Argo
# CD's application controller pod dials ITSELF instead of the workload cluster,
# and the connection fails. Apply it, find the symptom in Settings -> Clusters,
# name the single wrong field, then delete it.
#
# It uses a DISTINCT metadata.name (cluster-broken-server) and cluster name
# (workload-loopback) so it never touches the working `cluster-workload` Secret
# you created in E2.
#
# Render exactly as in E2: replace <TOKEN> with the base64-DECODED argocd-manager
# bearer token. TLS verification is disabled here only so the failure is clearly
# a REACHABILITY problem (the loopback server), not a certificate problem.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-broken-server
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: workload-loopback
  # WRONG: a loopback address is unreachable from the Argo CD pod. The correct
  # value (E2) is https://k3d-workload-server-0:6443.
  server: https://127.0.0.1:6443
  config: |
    {
      "bearerToken": "<TOKEN>",
      "tlsClientConfig": {
        "insecure": true
      }
    }
