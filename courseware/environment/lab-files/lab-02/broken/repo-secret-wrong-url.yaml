# BROKEN RECORD (Lab 2 E5) — a repository connection Secret whose URL points at a
# repository that does not exist. Apply it, find the symptom in
# Settings -> Repositories, name the single wrong field, then delete it.
#
# It uses a DISTINCT metadata.name (repo-broken-url) so it never touches the
# working `repo-storefront-gitops` Secret you created in E1.
#
# Render exactly as in E1: replace <PASSWORD> with the Gitea password for user
# `student` from ~/course/credentials/gitea-student.txt (never commit it).
apiVersion: v1
kind: Secret
metadata:
  name: repo-broken-url
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  # WRONG: there is no `storefront-typo` repository in the `course` org.
  url: http://lab-gitea:3000/course/storefront-typo.git
  username: student
  password: <PASSWORD>
