# Least-privilege RBAC for Argo CD on the WORKLOAD cluster (blueprint 8.7.1).
#
# Lab 2 exercise E2 applies this with `kubectl --context k3d-workload apply -f`.
# It creates the identity Argo CD uses on the workload cluster and grants it only
# what the course apps need, per namespace. There is NO ClusterRoleBinding with
# write access; the cluster Secret uses clusterResources:false.
#
#   - ServiceAccount argocd-manager in argocd-access  (the identity)
#   - Secret argocd-manager-token                     (long-lived bearer token)
#   - Role argocd-deployer + RoleBinding in storefront-dev/staging/prod and
#     platform-system                                 (full course write set)
#   - Role argocd-deployer-team + RoleBinding in team-a
#     (same set MINUS NetworkPolicies, ResourceQuotas, LimitRanges)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: argocd-access
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: argocd-access
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
# ---------------------------------------------------------------------------
# storefront-dev
# ---------------------------------------------------------------------------
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-deployer
  namespace: storefront-dev
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-deployer
  namespace: storefront-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-deployer
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: argocd-access
