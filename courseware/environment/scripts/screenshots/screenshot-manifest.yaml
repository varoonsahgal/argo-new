# screenshot-manifest.yaml — authoritative inventory of the 71 course screenshots.
#
# Consumed by capture.mjs (see README.md). One entry per screenshot ID from
# blueprint section 9.2. This file is the single source of truth for WHAT gets
# captured, WHERE it is written, and WHAT state must exist first.
#
# IMPORTANT (blueprint 9.1 / P-18): every `route` and `highlight.selector` below
# is PROVISIONAL. Argo CD UI routes and DOM selectors must be confirmed live at
# capture time and never invented into a participant guide. capture.mjs degrades
# gracefully when a selector cannot be found (it captures the shot and records a
# "selector not found" note in the capture log).
#
# `caption_note` marks the ApplicationSet Alpha UI (Alpha since Argo CD v3.5.0,
# blueprint EV-12); those captions MUST carry the note and be recaptured on any
# Argo CD version change.

version: 1

config:
  argocd_base_url: https://localhost:8443
  gitea_base_url: http://localhost:3000
  output_root: courseware/assets/screenshots
  capture_log: courseware/assets/screenshots/capture-log.md
  viewport:
    width: 1440
    height: 900
    device_scale_factor: 1
    color_scheme: light
  highlight:
    color: "#d7263d"
    width_px: 3
    style: solid
  # Credentials are read from these env vars, falling back to the on-VM files.
  # ARGOCD_ADMIN_PASSWORD  (else ~/course/credentials/argocd-admin.txt)
  # TEAM_A_DEV_PASSWORD    (else ~/course/credentials/team-a-dev.txt)
  # GITEA_PASSWORD         (else ~/course/credentials/gitea-student.txt)

